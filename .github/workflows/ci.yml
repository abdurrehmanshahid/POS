name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Deployment is started by a person, from Actions -> CI -> Run workflow, on
  # main. See "the approval" in the header below for why it is not a push.
  workflow_dispatch:

# Cancel superseded runs on the same ref.
#
# Only for pull requests. A run on main can be in the middle of a deployment,
# and cancelling that is precisely the failure `deploy.sh` is built to avoid:
# the process is killed wherever it happens to be — mid-migration, or with the
# site in maintenance mode and no step left to take it out. The event is part
# of the group as well, so a push landing during a manual deployment run cannot
# collide with it at all.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# ---------------------------------------------------------------------------
# THE production pipeline. Verify, build, deploy, and an independent external
# smoke test — the whole release path, in one file.
#
# It replaced `azure-pipelines.yml`, which was the authoritative pipeline until
# 2026-08-29 and was retired because the Azure DevOps account had no credits.
# See `decisions.md` D54. The architecture is unchanged; only the runner is.
#
# ── Why the deploy runs ON the box, not over SSH ───────────────────────────
#
# The deploy job targets a SELF-HOSTED RUNNER installed on the production box.
# GitHub never connects inward: the runner dials OUT and polls for work.
#
# That is a security decision, not a convenience one. An SSH-from-hosted-runner
# design needs port 22 reachable from GitHub's published address ranges, which
# in practice means 22 open to the world on a box that bills course fees. With a
# self-hosted runner, 22 stays restricted to the administrator's own IP (`ufw`,
# checklist P3-05) and there is no inbound deployment path at all.
#
# The runner runs as the `institute` service account, which holds exactly three
# sudo grants — reload php8.4-fpm, restart and status institute-queue — and
# nothing else. Installing it as root to "make the pipeline simpler" would hand
# every future edit of this file unrestricted control of the box.
#
# ── What is NOT in this file, deliberately ─────────────────────────────────
#
# The approval, the branch restriction and the one-at-a-time guarantee are
# configured on the `production` Environment in GitHub settings. They cannot
# live here and that is the point: a workflow file cannot meaningfully gate
# itself, because anything it said about who may approve it is something a pull
# request could change.
#
#   Environment `production`  ->  Deployment branches: main only
#   `workflow_dispatch`       ->  a human presses go (see below)
#   `concurrency` below       ->  one release at a time
#   `flock` in deploy.sh      ->  the lock that actually matters, because it
#                                 also covers a human running a release by hand
#
# ── The approval, and why it is where it is ────────────────────────────────
#
# It was meant to be the Environment's Required reviewers, for the reason
# above: a workflow file cannot meaningfully gate itself, because anything it
# says about who may approve a deployment is something a pull request could
# change. That is still the right answer and it is still not available here.
# GitHub refuses the rule outright on this repository — it is private on a
# personal plan, and required reviewers on an Environment is a paid feature:
#
#     422  Failed to create the environment protection rule. Please ensure the
#          billing plan supports the required reviewers protection rule.
#
# So the deploy job runs on `workflow_dispatch` and not on `push`. Landing on
# main no longer deploys anything; a person opens Actions -> CI -> Run workflow
# and picks main, which runs the tests and then the deployment. The human is
# still the one who presses go, which is the property that matters on software
# that bills course fees.
#
# Be clear about what is weaker: this gate lives in a file, so a pull request
# can move it, where a reviewer requirement lives in settings and cannot be. It
# is second best, chosen because the alternative on this plan is not "reviewer
# approval" but "every green push deploys itself unattended".
#
# If the plan is ever upgraded: add Required reviewers to the `production`
# Environment, put `push` back in the deploy job's `if:`, and delete this
# section. The rest of the file does not change.
#
# ── The required status check ──────────────────────────────────────────────
#
# The single required status check on `main` is the job named exactly "CI".
# That name is configured in branch protection, which lives in GitHub settings
# rather than in this repository, so renaming or removing that job silently
# stops protecting the branch.
#
# Everything real therefore runs in matrix jobs, and "CI" is a thin gate that
# passes only when all of them passed. Adding a PHP version, a database or a
# whole new job means editing the matrix and the `needs` list here; branch
# protection never has to be touched again.
#
# The previous version of this file detected "a stack" generically and ran
# `npm test --if-present` and `pytest -q || true`. Neither could fail: there is
# no npm test script and no Python in this repository, so CI went green in 18
# seconds having verified nothing, including on the commit that rewrote the
# money layer. A check that cannot fail is worse than no check, because it is
# trusted. Every step below either asserts something or is not here.
# ---------------------------------------------------------------------------

env:
  # Flipping this to 'true' is a COMMIT, not a click, so enabling production
  # deployment carries an author and a reviewer in the history and reverting is
  # one revert. Do NOT make it a workflow_dispatch input. It is a convenience
  # gate, NOT the security control — the Environment's reviewers and branch
  # restriction are.
  DEPLOY_ENABLED: 'true'
  PRODUCTION_HOST: pos.bigbinaryerp.com
  BUILD_STAGE_DIR: /var/www/institute-builds

jobs:
  tests:
    name: PHP ${{ matrix.php }} · ${{ matrix.db }}${{ matrix.mysql-image && format(' ({0})', matrix.mysql-image) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # Report every broken combination in one run rather than stopping at the
      # first. "php and mysql both fail" is a different diagnosis from
      # "php fails".
      fail-fast: false
      matrix:
        # The floor composer.json supports, and what the project is developed
        # on. Testing only the floor lets a deprecation land unnoticed; testing
        # only the newest lets in syntax the floor cannot parse.
        #
        # 8.3 was in this list on the first run and failed: composer.json said
        # "^8.3" while the lock pinned sixteen Symfony packages needing 8.4.1,
        # so the project could not install on the version it advertised. The
        # constraint now tells the truth and `config.platform.php` keeps a
        # future `composer update` on a newer machine from raising the floor
        # again without anyone noticing.
        php: ['8.4', '8.5']
        db: [sqlite]
        include:
          # Production runs MySQL and the suite runs SQLite, which would be
          # unremarkable except that this codebase hand-writes driver-specific
          # SQL in four services (Ledger, Reporting, Analytics, DatabaseBackup)
          # and in the identifier-prefix migration. Those branches are exactly
          # the code no amount of SQLite testing can reach.
          #
          # 8.0 is the PRODUCTION-PARITY leg: deploy/provision.sh installs
          # Ubuntu 24.04's `mysql-server` metapackage, which resolves to the
          # 8.0.x line, not 8.4. Gate on the version the counter actually runs.
          - php: '8.4'
            db: mysql
            mysql-image: 'mysql:8.0'
          # 8.4 stays for forward compatibility. Do NOT upgrade production to
          # 8.4 to make this the only MySQL leg — Ubuntu's supported package is
          # the lower-risk option right now.
          - php: '8.4'
            db: mysql
            mysql-image: 'mysql:8.4'

    services:
      # Declared for every leg because GitHub Actions cannot start a service
      # conditionally on a matrix value. The SQLite legs ignore it and fall back
      # to the 8.0 image they never connect to; a few seconds of container start
      # is cheaper than maintaining a second near-identical job that drifts out
      # of step with this one.
      #
      # A few seconds of container start on the SQLite legs is cheaper than a
      # second near-identical job that drifts out of step with this one.
      mysql:
        image: ${{ matrix.mysql-image || 'mysql:8.0' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: institute_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Listed explicitly rather than trusting the runner image's defaults,
          # so a change to that image cannot quietly remove one. pdo_mysql for
          # the mysql leg, gd and zip for dompdf and phpspreadsheet, sodium for
          # the encrypted two-factor casts.
          extensions: mbstring, xml, curl, zip, bcmath, intl, gd, sodium, fileinfo, pdo_sqlite, pdo_mysql
          coverage: none
          tools: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Validate composer.json against composer.lock
        # Catches a manifest edited without re-locking, which otherwise surfaces
        # as a mystery dependency difference between a laptop and the server.
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-ansi

      - name: Prepare environment
        # phpunit.xml supplies the test database and drivers. This step exists
        # only for APP_KEY, which the encrypted two-factor casts genuinely
        # require.
        #
        # Written inline rather than copied from .env.example: the example files
        # are no longer tracked in this repository, and a CI step that depends on
        # an untracked file is a step that fails the first time someone clones
        # clean. Four lines is a smaller thing to keep correct than a file that
        # has to exist for a reason nobody remembers.
        run: |
          printf 'APP_NAME=Institute\nAPP_ENV=testing\nAPP_DEBUG=true\nAPP_KEY=\n' > .env
          php artisan key:generate

      - name: Check code style
        # Its own step so a style failure is never mistaken for broken
        # behaviour, or the other way round.
        run: vendor/bin/pint --test

      - name: Wait for MySQL
        if: matrix.db == 'mysql'
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is up"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready within 60s"
          exit 1

      - name: Run the test suite
        # DB_* is set here rather than in phpunit.xml because PHPUnit's <env>
        # entries do not overwrite a variable that already exists in the
        # environment. That is what lets one suite run against both drivers
        # without a second config file to keep in step with the first.
        env:
          DB_CONNECTION: ${{ matrix.db == 'mysql' && 'mysql' || 'sqlite' }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ${{ matrix.db == 'mysql' && 'institute_testing' || ':memory:' }}
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  assets:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 24, matching azure-pipelines.yml and provision.sh. Node 20 reached
          # end of life on 30 April 2026, and Vite 8 requires
          # ^20.19.0 || >=22.12.0.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # A real gate: the production bundle has to compile. There is no npm
        # test script in this project, so none is pretended at here.
        run: npm run build

      - name: Verify the Vite manifest exists
        # The next step publishes public/build as the artifact the deploy job
        # unpacks under the release SHA, and deploy.sh refuses on a missing
        # manifest.json. Asserting the shape here means a build that silently
        # emits nothing fails in `assets`, where it is obvious, rather than in
        # `deploy`, where it looks like a deployment problem.
        run: |
          test -f public/build/manifest.json \
            || { echo "::error::Vite produced no public/build/manifest.json"; exit 1; }
          find public/build -type f

      - name: Publish build-assets
        uses: actions/upload-artifact@v7
        with:
          name: build-assets
          # The CONTENTS of public/build, so the artifact unpacks to
          # <sha>/manifest.json rather than <sha>/build/manifest.json — which is
          # the shape deploy.sh's preflight looks for.
          path: public/build/
          if-no-files-found: error
          retention-days: 14

  CI:
    # The required status check. Keep this name.
    name: CI
    runs-on: ubuntu-latest
    needs: [tests, assets]
    # `always()` so the gate still runs when something upstream failed, which is
    # precisely when its verdict matters. Without it the job is skipped on
    # failure, and a skipped required check can read as "not failing".
    if: always()

    steps:
      - name: Verify every check passed
        run: |
          echo "tests:  ${{ needs.tests.result }}"
          echo "assets: ${{ needs.assets.result }}"
          if [ "${{ needs.tests.result }}" != "success" ] || [ "${{ needs.assets.result }}" != "success" ]; then
            echo "::error::One or more required checks did not pass."
            exit 1
          fi
          echo "All checks passed."
          echo "This gate proves the commit is good. Deployment is a separate"
          echo "job below, gated on the production Environment's approval."

  # =========================================================================
  # Deploy — on the box itself
  # =========================================================================
  deploy:
    name: Deploy to production
    needs: [CI]
    # Started by a person, never by a push. See "The approval" in the header.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.CI.result == 'success'
    runs-on: [self-hosted, institute-prod]
    timeout-minutes: 30

    # The `production` Environment carries the required reviewer and the
    # branch restriction. Those are UI settings, on purpose — see the header.
    environment:
      name: production
      url: https://${{ env.PRODUCTION_HOST }}

    # One release at a time. cancel-in-progress is false because cancelling a
    # deploy mid-migration is worse than queueing behind it. This is the first
    # of two layers; the `flock` in deploy.sh is the one that matters, because
    # it also covers a human who SSHes in and runs a release by hand.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      # The repository is already on the box at /var/www/institute. Checking one
      # out here would clone into the runner's work directory instead, and
      # deploy.sh operates on the real tree.
      - name: Skip checkout
        run: echo "The repository lives at /var/www/institute; the runner does not need a copy."

      - name: Refuse unless DEPLOY_ENABLED
        run: |
          if [ "${DEPLOY_ENABLED}" != "true" ]; then
            echo "DEPLOY_ENABLED is '${DEPLOY_ENABLED}'. Refusing to deploy."
            echo "Set it to 'true' in .github/workflows/ci.yml — deliberately a commit."
            exit 1
          fi

      - name: Download the tested build
        uses: actions/download-artifact@v4
        with:
          name: build-assets
          path: ${{ runner.temp }}/build-assets

      - name: Stage assets under the exact SHA
        run: |
          set -euo pipefail
          STAGE="${BUILD_STAGE_DIR}/${GITHUB_SHA}"

          test -f "${RUNNER_TEMP}/build-assets/manifest.json" \
            || { echo "::error::Downloaded artifact has no manifest.json"; exit 1; }

          # Replaced, not merged: a partial directory from a failed earlier
          # attempt would satisfy deploy.sh's manifest check while missing half
          # the chunks.
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -a "${RUNNER_TEMP}/build-assets/." "$STAGE/"

          test -f "$STAGE/manifest.json" \
            || { echo "::error::Staging did not produce $STAGE/manifest.json"; exit 1; }

          echo "Staged $(find "$STAGE" -type f | wc -l) files at $STAGE"

      - name: deploy.sh
        run: |
          set -euo pipefail
          cd /var/www/institute

          # RELEASE_SHA is mandatory and has no fallback. deploy.sh verifies the
          # commit exists (git cat-file) and that the staged build is present
          # BEFORE it takes a backup or enters maintenance mode.
          #
          # BUILD_ASSETS=no: this box does not compile assets. The tested build
          # is already staged above.
          RELEASE_SHA="${GITHUB_SHA}" \
          BUILD_ASSETS=no \
          BUILD_STAGE_DIR="${BUILD_STAGE_DIR}" \
            bash deploy/deploy.sh
        # The runner already runs as `institute`, so there is no
        # `sudo -u institute` here — and there must not be, because the sudoers
        # file grants three systemctl commands and not a shell.

  # =========================================================================
  # Independent external smoke test
  # =========================================================================
  # From a GitHub-hosted runner, over the public internet, on purpose.
  #
  # deploy.sh already checks localhost /up and public /ready from the box
  # itself. That is necessary and not sufficient: a check that originates on the
  # server shares the server's DNS resolver, bypasses the host firewall
  # entirely, and can succeed on a box nobody outside can reach. This one
  # crosses DNS, the firewall, TLS, nginx, PHP-FPM, Laravel and MySQL — the same
  # path a member of staff takes.
  smoke:
    name: External smoke test
    needs: [deploy]
    # A skipped `deploy` already skips this, but the condition is stated rather
    # than inherited: the one failure mode worth ruling out is a green
    # "External smoke test" beside a deployment that never ran.
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Public GET /ready
        run: |
          set -euo pipefail
          URL="https://${PRODUCTION_HOST}/ready"

          # Retried, because PHP-FPM has just been reloaded and the first
          # request after `artisan up` can land microseconds early.
          for attempt in 1 2 3 4 5; do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)"
            echo "attempt ${attempt}: ${URL} -> ${CODE}"
            if [ "$CODE" = "200" ]; then
              echo "Production is publicly ready."
              exit 0
            fi
            sleep 6
          done

          echo "::error::${URL} did not return 200."
          echo "503 here usually means the deploy left maintenance mode ON - check the deploy job's tail."
          echo "000 means DNS, TLS or the host firewall, not the application."
          exit 1
