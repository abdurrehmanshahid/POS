# ---------------------------------------------------------------------------
# Institute POS — the authoritative production pipeline.
#
# Azure DevOps is the deployment system. `.github/workflows/ci.yml` still exists
# and still runs the test matrix, because the repository pushes to both remotes
# on the same `git push` and a second opinion on a commit is free — but it
# deploys nothing and must never be given the ability to. There is exactly one
# path to production and it is this file.
#
#   commit
#     -> Verify        four legs; PHP 8.4 x MySQL 8.0 is the one that gates
#     -> CI            the required check, named exactly `CI`
#     -> BuildAssets   Node 24, npm ci && npm run build, published as an artifact
#     -> [approval]    a human, in the `production` Environment
#     -> Deploy        runs ON the Lightsail box as an Environment VM resource
#     -> Smoke         a Microsoft-hosted agent fetches the public https /ready
#
# ── What is NOT in this file, deliberately ────────────────────────────────
#
# Approval, branch control and the exclusive lock are Azure DevOps Environment
# checks. They live in the UI, on Pipelines > Environments > production, and
# they cannot be expressed here. A YAML file cannot gate itself: anything this
# file could say about who may approve it is something a pull request could
# change. docs/DEPLOYMENT.md §8 has the click-by-click.
#
# The server-side `flock` in deploy.sh is the second half of the exclusive lock,
# and it is the half that matters — the Environment lock does not cover a human
# who SSHes in and runs a release by hand.
# ---------------------------------------------------------------------------

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

name: $(Build.SourceBranchName)-$(Build.BuildId)

variables:
  # The exact revision this run tested, threaded all the way to `git reset
  # --hard` on the server. Not a branch name: `origin/main` is a race, because
  # a commit can land between the approval and the deploy, and the pipeline log
  # would look identical either way.
  RELEASE_SHA: $(Build.SourceVersion)

  # The public address the external smoke test fetches. Not a secret; it is
  # printed on every fee voucher.
  PRODUCTION_HOST: pos.bbt.edu.pk

  # Must match BUILD_STAGE_DIR in deploy/deploy.sh and the directory
  # deploy/provision.sh creates.
  BUILD_STAGE_DIR: /var/www/institute-builds

stages:

  # =========================================================================
  # Verify
  # =========================================================================
  - stage: verify
    displayName: Verify
    jobs:

      # -------------------------------------------------------------------
      - job: tests
        displayName: Tests
        timeoutInMinutes: 20
        pool:
          vmImage: ubuntu-24.04

        strategy:
          # Report every broken combination in one run rather than stopping at
          # the first. "php and mysql both fail" is a different diagnosis from
          # "php fails".
          #
          # dbName and mysqlImage are carried in the matrix rather than derived
          # further down. A `${{ if eq(variables['dbDriver'], ...) }}` is
          # evaluated at COMPILE time, before the matrix exists, so it would
          # resolve to nothing on every leg and hand the suite an empty database
          # name.
          matrix:

            # THE PRODUCTION-PARITY LEG. deploy/provision.sh installs Ubuntu
            # 24.04's `mysql-server` metapackage, which resolves to the 8.0.x
            # line — not 8.4. This is the version the counter actually runs on,
            # so this is the leg the gate has to care about.
            #
            # Do NOT upgrade production to 8.4 to make the other leg match.
            # Ubuntu's supported package is the lower-risk option, and "change
            # production so CI is tidier" is the wrong direction of travel.
            php84_mysql80:
              phpVersion: '8.4'
              dbDriver: mysql
              dbName: institute_testing
              mysqlImage: 'mysql:8.0'
              legIsRequired: 'yes'

            # Forward compatibility, not the gate. Kept because it has already
            # earned its place once: it caught `admissions.status => 'active'`,
            # a value absent from the column's enum, which would have failed
            # every one of the 478 roll-import rows on MySQL while passing on
            # SQLite — the CHECK constraint had been lost when a later migration
            # rebuilt the table. SQLite alone could never have told us.
            php84_mysql84:
              phpVersion: '8.4'
              dbDriver: mysql
              dbName: institute_testing
              mysqlImage: 'mysql:8.4'
              legIsRequired: 'no'

            # The fast legs. This codebase hand-writes driver-specific SQL in
            # four services, so SQLite is not redundant with MySQL — it is the
            # other branch of those conditionals.
            php84_sqlite:
              phpVersion: '8.4'
              dbDriver: sqlite
              dbName: ':memory:'
              mysqlImage: ''
              legIsRequired: 'yes'

            # 8.5 on the fast driver only. Testing only the floor lets a
            # deprecation land unnoticed; testing only the newest lets in syntax
            # the floor cannot parse. Production stays on 8.4 regardless — the
            # sudoers file names php8.4-fpm literally.
            php85_sqlite:
              phpVersion: '8.5'
              dbDriver: sqlite
              dbName: ':memory:'
              mysqlImage: ''
              legIsRequired: 'no'

        steps:
          # PHP from the SAME ondrej PPA that deploy/provision.sh uses. That is
          # deliberate and worth the extra minute: CI and production take their
          # runtime from one source, so "it passed in CI" and "it runs on the
          # box" are statements about the same build of PHP.
          - script: |
              set -e
              sudo add-apt-repository -y ppa:ondrej/php
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends \
                php$(phpVersion)-cli php$(phpVersion)-mbstring php$(phpVersion)-xml \
                php$(phpVersion)-curl php$(phpVersion)-zip php$(phpVersion)-bcmath \
                php$(phpVersion)-intl php$(phpVersion)-gd php$(phpVersion)-sqlite3 \
                php$(phpVersion)-mysql
              sudo update-alternatives --set php /usr/bin/php$(phpVersion)
              php -v
            displayName: Set up PHP $(phpVersion)
            # Extensions listed explicitly rather than trusting the image's
            # defaults: gd and zip for dompdf and phpspreadsheet, sqlite3 and
            # mysql for the two drivers. sodium ships in the ondrej cli package
            # and the encrypted two-factor casts need it.

          - task: Cache@2
            displayName: Cache Composer packages
            inputs:
              key: 'composer | "$(Agent.OS)" | $(phpVersion) | composer.lock'
              restoreKeys: |
                composer | "$(Agent.OS)" | $(phpVersion)
              path: $(HOME)/.cache/composer/files

          - script: composer validate --strict --no-check-publish
            displayName: Validate composer.json against composer.lock
            # Catches a manifest edited without re-locking, which otherwise
            # surfaces as a mystery dependency difference between machines.

          - script: composer install --prefer-dist --no-interaction --no-progress --no-ansi
            displayName: Install dependencies

          - script: |
              cp .env.example .env
              php artisan key:generate
            displayName: Prepare environment
            # phpunit.xml supplies the test database. This exists for APP_KEY,
            # which the encrypted two-factor casts genuinely require and which
            # .env.example deliberately ships blank.
            #
            # .env.example, NOT .env.production.example: this is a CI runner, it
            # has no MySQL on 127.0.0.1 at this point, no TLS and no backup
            # directory, and the production template asserts all three.

          - script: vendor/bin/pint --test
            displayName: Check code style
            # Its own step so a style failure is never mistaken for broken
            # behaviour, or the other way round.

          # A container started per leg rather than an Azure service container.
          # `services:` is resolved at compile time and cannot read a matrix
          # value, so declaring it would start MySQL on the SQLite legs too and
          # — worse — could not vary the image between the 8.0 and 8.4 legs,
          # which is the entire reason both legs exist.
          - script: |
              set -e
              docker run -d --name mysql -p 3306:3306 \
                -e MYSQL_ROOT_PASSWORD=root \
                -e MYSQL_DATABASE=$(dbName) \
                $(mysqlImage)
              for i in $(seq 1 45); do
                if docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null; then
                  echo "MySQL is up:"; docker exec mysql mysql -uroot -proot -e "SELECT VERSION();"
                  exit 0
                fi
                sleep 2
              done
              echo "MySQL did not become ready within 90s"; docker logs mysql; exit 1
            displayName: Start $(mysqlImage)
            condition: eq(variables['dbDriver'], 'mysql')

          - script: php artisan test
            displayName: Run the test suite
            env:
              DB_CONNECTION: $(dbDriver)
              DB_HOST: 127.0.0.1
              DB_PORT: 3306
              DB_DATABASE: $(dbName)
              DB_USERNAME: root
              DB_PASSWORD: root
            # DB_* is set here rather than in phpunit.xml because PHPUnit's
            # <env> entries do not overwrite a variable that already exists in
            # the environment. That is what lets one suite run against both
            # drivers without a second config file to keep in step.
            #
            # This suite uses RefreshDatabase. It runs HERE and only here.
            # It must never be pointed at `institute_pos` on the production box:
            # it would drop every table in it. Production is smoke-tested
            # through a browser, never through PHPUnit.

          - script: |
              set -e
              php artisan migrate --force
              php artisan migrate:reset --force
              php artisan migrate --force
            displayName: Prove the migrations roll back
            env:
              DB_CONNECTION: $(dbDriver)
              DB_HOST: 127.0.0.1
              DB_PORT: 3306
              DB_DATABASE: $(dbName)
              DB_USERNAME: root
              DB_PASSWORD: root
            # The test suite only ever migrates FORWARD, so every down() method
            # in this repository was unexecuted code. Two of them were broken —
            # one dropped a foreign key but left its column behind, another left
            # an index it had created — and both were found by hand, during a
            # release, rather than here.
            #
            # Down, then up again: a down() that half-reverses passes the first
            # leg and fails the second on the duplicate it left behind.

      # -------------------------------------------------------------------
      - job: CI
        displayName: CI
        dependsOn: [tests]
        # `always()` so the gate still runs when something upstream failed,
        # which is precisely when its verdict matters. A skipped required check
        # can read as "not failing".
        condition: always()
        pool:
          vmImage: ubuntu-24.04

        steps:
          - checkout: none
          - script: |
              echo "tests: $(dependencies.tests.result)"
              if [ "$(dependencies.tests.result)" != "Succeeded" ]; then
                echo "##vso[task.logissue type=error]The test matrix did not pass."
                exit 1
              fi
              echo "All required checks passed."
            displayName: Verify every required check passed
            # THIS JOB'S NAME IS THE REQUIRED CHECK.
            #
            # `CI` is configured as the required status check in the branch
            # policy on main, which lives in Azure DevOps project settings and
            # NOT in this repository. Renaming this job silently stops
            # protecting the branch: the policy goes on waiting for a check that
            # no longer exists, or is quietly dropped, depending on the setting.
            #
            # `dependsOn: [tests]` covers the whole matrix — Azure rolls every
            # leg's result into one job result, so a failure on ANY leg,
            # required or forward-compatibility, fails this gate. That is
            # intentional: an optional leg is optional in what it proves, not in
            # whether it is allowed to be broken.

  # =========================================================================
  # Build the assets, once, in one place
  # =========================================================================
  # Nothing generated enters git — public/build is git-ignored and stays that
  # way. It is built here and shipped as an artifact, because npm on the
  # production box is a dependency production should not have and a build there
  # is a build nobody reviewed.
  - stage: build_assets
    displayName: Build assets
    dependsOn: verify
    condition: succeeded()
    jobs:
      - job: assets
        displayName: Vite build (Node 24)
        timeoutInMinutes: 15
        pool:
          vmImage: ubuntu-24.04

        steps:
          - task: NodeTool@0
            displayName: Set up Node 24
            inputs:
              versionSpec: '24.x'
            # 24, not 20. Node 20 reached end of life on 30 April 2026 and
            # Vite 8 requires ^20.19.0 || >=22.12.0. provision.sh installs the
            # same major on the box for its emergency fallback path.

          - task: Cache@2
            displayName: Cache npm
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(HOME)/.npm

          - script: npm ci
            displayName: npm ci

          - script: npm run build
            displayName: npm run build

          - script: |
              set -e
              test -f public/build/manifest.json \
                || { echo "##vso[task.logissue type=error]Vite produced no public/build/manifest.json"; exit 1; }
              echo "manifest.json present:"
              cat public/build/manifest.json
              echo
              find public/build -type f | sed 's/^/  /'
            displayName: Verify the Vite manifest exists
            # The artifact is only useful if it has the shape deploy.sh expects.
            # deploy.sh preflight refuses on a missing
            # ${BUILD_STAGE_DIR}/<sha>/manifest.json, and this is the step that
            # makes that refusal impossible to reach for a reason as dull as
            # "the build silently emitted nothing". Verified against the real
            # output: manifest.json sits at the ROOT of public/build, with
            # assets/ beside it.

          - task: PublishPipelineArtifact@1
            displayName: Publish build-assets
            inputs:
              targetPath: 'public/build'
              artifact: 'build-assets'
              publishLocation: 'pipeline'
            # The CONTENTS of public/build, so the artifact unpacks to
            # <sha>/manifest.json rather than <sha>/build/manifest.json.

  # =========================================================================
  # Deploy — on the box itself
  # =========================================================================
  # This runs on the Lightsail instance, registered as a Virtual Machine
  # resource in the `production` Environment. NOT over SSH from a hosted agent.
  #
  # The reason is the firewall. An SSH-from-hosted-agent design needs port 22
  # reachable from Microsoft's address ranges, which in practice means 22 open
  # to the world. A VM agent dials OUT to Azure DevOps and polls for work, so 22
  # stays restricted to the administrator's own IP and there is no inbound
  # deployment path at all.
  #
  # The agent runs as the `institute` service account, which already has exactly
  # three sudo grants (reload php8.4-fpm, restart/status institute-queue) and
  # nothing else. Registering the agent as root to "make the pipeline simpler"
  # would hand every future pipeline edit unrestricted control of the box.
  - stage: deploy_production
    displayName: Deploy to production
    dependsOn: build_assets
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

    jobs:
      - deployment: production
        displayName: Release $(RELEASE_SHA)
        timeoutInMinutes: 30
        environment:
          name: production
          resourceType: VirtualMachine
          resourceName: institute-prod
          # Approval, branch control and the exclusive lock are configured on
          # this Environment in the Azure DevOps UI. They are not expressible
          # here, and that is the point — see the header of this file.

        strategy:
          runOnce:
            deploy:
              steps:
                # The repository is already on the box; the agent does not need
                # its own copy, and checking one out here would clone into the
                # agent's work directory rather than /var/www/institute.
                - checkout: none

                - task: DownloadPipelineArtifact@2
                  displayName: Download the tested build
                  inputs:
                    artifact: 'build-assets'
                    path: '$(Pipeline.Workspace)/build-assets'

                - script: |
                    set -euo pipefail

                    STAGE="$(BUILD_STAGE_DIR)/$(RELEASE_SHA)"

                    test -f "$(Pipeline.Workspace)/build-assets/manifest.json" \
                      || { echo "##vso[task.logissue type=error]Downloaded artifact has no manifest.json"; exit 1; }

                    # Replaced, not merged: a partial directory from a failed
                    # earlier attempt would satisfy deploy.sh's manifest check
                    # while missing half the chunks.
                    rm -rf "$STAGE"
                    mkdir -p "$STAGE"
                    cp -a "$(Pipeline.Workspace)/build-assets/." "$STAGE/"

                    test -f "$STAGE/manifest.json" \
                      || { echo "##vso[task.logissue type=error]Staging did not produce $STAGE/manifest.json"; exit 1; }

                    echo "Staged $(find "$STAGE" -type f | wc -l) files at $STAGE"
                  displayName: Stage assets under the exact SHA

                - script: |
                    set -euo pipefail
                    cd /var/www/institute

                    # RELEASE_SHA is mandatory and has no fallback. deploy.sh
                    # verifies the commit exists (git cat-file) and that the
                    # staged build is present BEFORE it takes a backup or enters
                    # maintenance mode.
                    #
                    # BUILD_ASSETS=no: this box does not compile assets. The
                    # tested build is already staged above.
                    RELEASE_SHA="$(RELEASE_SHA)" \
                    BUILD_ASSETS=no \
                    BUILD_STAGE_DIR="$(BUILD_STAGE_DIR)" \
                      bash deploy/deploy.sh
                  displayName: deploy.sh RELEASE_SHA=$(RELEASE_SHA)
                  # The agent already runs as `institute`, so there is no
                  # `sudo -u institute` here — and there must not be, because
                  # the sudoers file grants three systemctl commands and not a
                  # shell.

  # =========================================================================
  # Independent external smoke test
  # =========================================================================
  # From a Microsoft-hosted agent, over the public internet, on purpose.
  #
  # deploy.sh already checks localhost /up and public /ready from the box
  # itself. That is necessary and not sufficient: a check that originates on the
  # server shares the server's DNS resolver, bypasses the Lightsail firewall
  # entirely, and can succeed on a box nobody outside can reach. This one
  # crosses DNS, the firewall, TLS, nginx, PHP-FPM, Laravel and MySQL, which is
  # the same path a member of staff takes.
  - stage: external_smoke
    displayName: External smoke test
    dependsOn: deploy_production
    condition: succeeded()
    jobs:
      - job: smoke
        displayName: Public GET /ready
        pool:
          vmImage: ubuntu-24.04
        steps:
          - checkout: none
          - script: |
              set -euo pipefail
              URL="https://$(PRODUCTION_HOST)/ready"

              # Retried, because PHP-FPM has just been reloaded and the first
              # request after `artisan up` can land microseconds early.
              for attempt in 1 2 3 4 5; do
                CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)"
                echo "attempt ${attempt}: ${URL} -> ${CODE}"
                if [ "$CODE" = "200" ]; then
                  echo "Production is publicly ready."
                  exit 0
                fi
                sleep 6
              done

              echo "##vso[task.logissue type=error]${URL} did not return 200."
              echo "503 here usually means the deploy left maintenance mode ON — check the deploy job's tail."
              echo "000 means DNS, TLS or the Lightsail firewall, not the application."
              exit 1
            displayName: Fetch https://$(PRODUCTION_HOST)/ready
